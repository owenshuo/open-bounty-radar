name: Pages Dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.OPEN_BOUNTY_RADAR_GITHUB_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Build offline demo
        run: |
          npm run demo:offline
          mkdir -p public/demo
          cp -R reports/. public/demo/
          cat > public/demo/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta http-equiv="refresh" content="0; url=./demo-dashboard.html">
              <title>Open Bounty Radar Offline Demo</title>
            </head>
            <body>
              <p><a href="./demo-dashboard.html">Open the offline demo dashboard</a></p>
            </body>
          </html>
          HTML
          rm -rf reports
      - name: Build live dashboard
        run: |
          npm run scan:discovery
          mkdir -p public/live
          cp -R reports/. public/live/
      - name: Prepare Pages index
        run: |
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta http-equiv="refresh" content="0; url=./live/discovery-dashboard.html">
              <title>Open Bounty Radar Live Dashboard</title>
            </head>
            <body>
              <p><a href="./live/discovery-dashboard.html">Open the live Open Bounty Radar dashboard</a></p>
              <p><a href="./demo/demo-dashboard.html">Open the offline demo dashboard</a></p>
            </body>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
